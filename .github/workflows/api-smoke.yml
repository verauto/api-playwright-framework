name: API Tests

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Test tag: smoke, regression, any other tag, or all'
        required: true
        default: smoke
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_ENV: dev
      API_BASE_URL: https://api.restful-api.dev
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run selected test category
        shell: bash
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          CATEGORY="${CATEGORY#@}"
          if [ "$CATEGORY" = "all" ]; then
            npx playwright test
          elif [[ "$CATEGORY" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            npx playwright test --grep "@${CATEGORY}(\s|$)"
          else
            echo "::error::Use a tag containing letters, digits, underscores or hyphens, or use all."
            exit 1
          fi

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run report:generate

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Upload Allure raw results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  publish-report:
    name: Publish Allure to GitHub Pages
    needs: tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v5
        with:
          name: allure-report
          path: allure-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Locate report entry point
        id: report
        shell: bash
        run: |
          if [ -f allure-report/index.html ]; then
            echo "path=allure-report" >> "$GITHUB_OUTPUT"
          elif [ -f allure-report/awesome/index.html ]; then
            echo "path=allure-report/awesome" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Allure index.html was not found"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.report.outputs.path }}

      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
